info:
  name: createShoppingItem
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/shopping-lists/{{shoppingListId}}/items"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |-
      {
        "name": "Trứng gà",
        "quantity": 10,
        "unit": "PCS"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
