info:
  name: create-shopping-list
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/shopping-lists"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "name": "Đi chợ cuối tuần"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
