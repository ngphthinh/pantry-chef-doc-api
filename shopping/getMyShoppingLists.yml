info:
  name: getMyShoppingLists
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/shopping-lists?size=20"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
