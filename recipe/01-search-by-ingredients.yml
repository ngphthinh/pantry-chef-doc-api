info:
  name: search-by-ingredients
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/recipes/search?ingredients=shrimp&size=5"
  params:
    - name: ingredients
      value: shrimp
      type: query
    - name: size
      value: "5"
      type: query
    - name: cursor
      value: ""
      type: query
      disabled: true
    - name: cuisineId
      value: ""
      type: query
      disabled: true
    - name: maxMinutes
      value: "30"
      type: query
      disabled: true
    - name: difficulty
      value: MEDIUM
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
