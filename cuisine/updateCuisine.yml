info:
  name: updateCuisine
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/cuisines/{{cuisineId}}"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |-
      {
        "code": "JAPANESE",
        "name": "Japanese cuisine"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
